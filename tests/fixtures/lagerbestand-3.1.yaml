openapi: 3.1.0
info:
  title: Lagerbestand
  version: 0.9.0
  summary: Bestände abfragen und Bestandsänderungen melden
  description: Beispiel für OpenAPI 3.1 mit `webhooks` und Typlisten wie `[string, "null"]`.
servers:
  - url: https://lager.example.org
tags:
  - name: Bestand
paths:
  /artikel/{artikelNr}/bestand:
    get:
      tags: [Bestand]
      summary: Bestand eines Artikels je Lagerplatz
      operationId: getBestand
      parameters:
        - name: artikelNr
          in: path
          required: true
          schema:
            type: string
        - name: nurVerfuegbar
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Bestände
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lagerbestand"
    put:
      tags: [Bestand]
      summary: Bestand setzen (Inventur)
      operationId: setBestand
      parameters:
        - name: artikelNr
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Lagerbestand"
      responses:
        "200":
          description: Gesetzt
webhooks:
  bestandUnterMindestmenge:
    post:
      summary: Meldung, wenn der Bestand unter die Mindestmenge fällt
      operationId: onMindestmenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Lagerbestand"
      responses:
        "200":
          description: Die Meldung wurde angenommen
components:
  schemas:
    Lagerbestand:
      type: object
      required: [lagerplatz, menge]
      properties:
        lagerplatz:
          type: string
          examples: [A-04-12]
        menge:
          type: integer
          minimum: 0
        mindestmenge:
          type: [integer, "null"]
          description: Leer, wenn für den Artikel keine Mindestmenge gilt
        gezaehltAm:
          type: [string, "null"]
          format: date
